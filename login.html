<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Espace Client - Terravia</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@400..900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
</head>

<body class="is-loading page-transition">
    <div class="site-wrapper">

        <main class="login-main">
            <a href="index.html" class="back-link transition-link">
                <span class="material-symbols-outlined">arrow_back</span>
                Retour au site
            </a>
            <!-- Nous reproduisons ici la structure exacte du login-wrapper de la modale, mais sur fond blanc sans overlay sombre -->
            <div class="login-container">
                <div class="login-wrapper">
                    <div class="login-card">
                        <div class="brand-header">
                            <a class="logo-link transition-link" href="index.html">
                                <img alt="Terravia Logo" class="logo-icon" src="assets/logo-noir.svg" />
                            </a>
                            <h1 class="login-title">Connectez-vous</h1>
                            <p class="brand-subtitle">Saisissez vos identifiants pour accéder à votre espace.</p>
                        </div>

                        <form action="#" class="form-stack" method="POST" novalidate>
                            <div class="error-banner" id="error-banner" role="alert" aria-live="polite"></div>
                            <div class="inputs-wrapper">
                                <div class="input-group">
                                    <div class="input-wrapper">
                                        <span class="material-symbols-outlined input-icon">person</span>
                                        <input class="form-input" id="email" name="email" placeholder="votre@email.com"
                                            required="" type="email" aria-label="Email" />
                                    </div>
                                </div>

                                <div class="input-group">
                                    <div class="input-wrapper">
                                        <span class="material-symbols-outlined input-icon">lock</span>
                                        <input class="form-input" id="password" name="password" placeholder="Mot de passe"
                                            required="" type="password" aria-label="Mot de passe" />
                                        <button type="button" class="password-toggle" title="Afficher le mot de passe" aria-label="Afficher le mot de passe" aria-pressed="false">
                                            <span class="material-symbols-outlined">visibility_off</span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="flex-between" style="margin-bottom: 0; margin-top: -0.5rem; padding: 0 0.5rem;">
                                <div class="checkbox-group">
                                    <input class="checkbox-input" id="remember-me" name="remember-me" type="checkbox" />
                                    <label class="checkbox-label" for="remember-me">
                                        Se souvenir de moi
                                    </label>
                                </div>
                                <a class="forgot-password-link" href="#">Mot de passe oublié ?</a>
                            </div>

                            <button class="btn btn-primary" type="submit">
                                Accéder à la plateforme
                                <span class="material-symbols-outlined">login</span>
                            </button>
                            
                            <p class="footer-text brand-footer-text">
                                Pas encore de compte ?
                                <a class="footer-link brand-footer-link transition-link" href="index.html#contact">Contactez-nous</a>
                            </p>
                        </form>
                    </div>
                    
                </div>
            </div>
        </main>

    </div>
    <script src="script.js"></script>
    <script>
        // Toggle mot de passe (click pour afficher/cacher)
        const passwordToggle = document.querySelector('.password-toggle');
        const passwordInput = document.getElementById('password');

        if (passwordToggle && passwordInput) {
            const icon = passwordToggle.querySelector('span');

            passwordToggle.addEventListener('click', (e) => {
                e.preventDefault();
                const isHidden = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isHidden ? 'text' : 'password');
                icon.textContent = isHidden ? 'visibility' : 'visibility_off';
                passwordToggle.setAttribute('aria-pressed', isHidden ? 'true' : 'false');
                passwordInput.focus();
            });
        }

        // Validation du formulaire
        const submitBtn = document.querySelector('.form-stack .btn-primary[type="submit"]');
        const errorBanner = document.getElementById('error-banner');
        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('password');

        if (submitBtn && errorBanner) {
            submitBtn.addEventListener('click', (e) => {
                e.preventDefault();

                [emailInput, passInput].forEach(i => i.classList.remove('has-error'));
                errorBanner.classList.remove('visible');

                const emailEmpty = !emailInput.value.trim();
                const passEmpty = !passInput.value.trim();
                const emailInvalid = !emailEmpty && !emailInput.validity.valid;

                let message = '';

                if (emailEmpty && passEmpty) {
                    emailInput.classList.add('has-error');
                    passInput.classList.add('has-error');
                    message = 'Veuillez remplir tous les champs.';
                } else if (emailEmpty) {
                    emailInput.classList.add('has-error');
                    message = 'Veuillez saisir votre adresse email.';
                } else if (passEmpty) {
                    passInput.classList.add('has-error');
                    message = 'Veuillez saisir votre mot de passe.';
                } else if (emailInvalid) {
                    emailInput.classList.add('has-error');
                    message = 'Adresse email invalide.';
                }

                if (message) {
                    errorBanner.innerHTML = '<span class="material-symbols-outlined" style="font-size:1.1rem;vertical-align:middle">error</span> ' + message;
                    errorBanner.classList.add('visible');
                    return;
                }

                // Pas d'erreur : logique de connexion ici
            });

            // Retire l'état d'erreur dès que l'utilisateur retape
            [emailInput, passInput].forEach(input => {
                input.addEventListener('input', () => {
                    input.classList.remove('has-error');
                    if (![emailInput, passInput].some(i => i.classList.contains('has-error'))) {
                        errorBanner.classList.remove('visible');
                    }
                });
            });
        }
    </script>
</body>

</html>
